---
name: Nightly build CI

on:
  push:
    paths:
      - .github/workflows/nightly.yml
      - Dockerfile.client.production
      - Dockerfile.server.production
      - apps/dev/**
      - apps/client/**
      - apps/server/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
    branches:
      - master
  # Allows starting a build by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: your_spotify # required dummy value, only the labels are used

      # Image names on ghcr.io have to be lowercase
      - name: Lowercase image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client nightly
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client.production
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.docker-meta.outputs.labels }}
          tags: |
            ghcr.io/${{ env.OWNER }}/your_spotify_client:nightly
            ghcr.io/${{ env.OWNER }}/your_spotify_client:${{ github.sha }}

      - name: Build and push server nightly
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server.production
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.docker-meta.outputs.labels }}
          tags: |
            ghcr.io/${{ env.OWNER }}/your_spotify_server:nightly
            ghcr.io/${{ env.OWNER }}/your_spotify_server:${{ github.sha }}

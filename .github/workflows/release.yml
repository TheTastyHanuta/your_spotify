---

name: Release CI

# Runs when a release is published on GitHub. The release tag is the version
# and has to match the version in the package.json files.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: your_spotify # required dummy value, only the labels are used

      # Image names on ghcr.io have to be lowercase
      - name: Lowercase image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag matches package.json before pushing
        run: |
          for PKG_PATH in "./package.json" "./apps/client/package.json" "./apps/server/package.json"; do
            if [ -f "$PKG_PATH" ] && [ "$(node -p "require('$PKG_PATH').version")" != "$TAG" ]; then
              echo "Error: $PKG_PATH version doesn't match tag $TAG"
              exit 1
            fi
          done

      - name: Build and push client release
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client.production
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.docker-meta.outputs.labels }}
          tags: |
            ghcr.io/${{ env.OWNER }}/your_spotify_client:latest
            ghcr.io/${{ env.OWNER }}/your_spotify_client:${{ env.TAG }}

      - name: Build and push server release
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server.production
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.docker-meta.outputs.labels }}
          tags: |
            ghcr.io/${{ env.OWNER }}/your_spotify_server:latest
            ghcr.io/${{ env.OWNER }}/your_spotify_server:${{ env.TAG }}

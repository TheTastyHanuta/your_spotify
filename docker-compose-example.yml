services:
  server:
    image: ghcr.io/thetastyhanuta/your_spotify_server:latest
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      # Loopback works on this machine or through an SSH tunnel. For an HTTPS
      # reverse-proxy setup, replace all endpoints as described in the README.
      API_ENDPOINT: http://127.0.0.1:8080 # This MUST be included as a valid URL in the Spotify dashboard
      CLIENT_ENDPOINT: http://127.0.0.1:3000
      SPOTIFY_PUBLIC: __your_spotify_client_id__
      SPOTIFY_SECRET: __your_spotify_secret__

  mongo:
    image: mongo:8
    restart: always
    volumes:
      - ./your_spotify_db:/data/db

  web:
    image: ghcr.io/thetastyhanuta/your_spotify_client:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      API_ENDPOINT: http://127.0.0.1:8080

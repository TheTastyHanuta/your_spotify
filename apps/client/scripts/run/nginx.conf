# Runs as the unprivileged nginx user, so everything it writes lives in /tmp
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Files under /static have a content hash in their name and never change.
  # index.html and variables.js are rewritten at every container start.
  map $uri $cache_control {
    ~^/static/ "public, max-age=31536000, immutable";
    default "no-cache";
  }

  server {
    listen 3000;
    root /app/apps/client/build;

    # Locations below must not use add_header, they would drop these.
    # variables.sh rewrites the CSP below from FRAME_ANCESTORS.
    add_header Content-Security-Policy "frame-ancestors 'none';" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $cache_control always;

    # A missing hashed file must not get index.html cached for a year
    location /static/ {
      try_files $uri =404;
    }

    # The client routes everything else itself
    location / {
      try_files $uri /index.html;
    }
  }
}

# Example Nginx reverse proxy for YourSpotify ("Option C" in the README).
#
# The web app and the API each get their own HTTPS address under the same
# domain. Replace the domains and certificate paths (for example from
# Let's Encrypt with certbot), then use these addresses in the compose file:
#
#   server:  API_ENDPOINT: https://api.yourspotify.example.com
#            CLIENT_ENDPOINT: https://yourspotify.example.com
#   web:     API_ENDPOINT: https://api.yourspotify.example.com
#
# Publish the containers' ports on 127.0.0.1 only ("127.0.0.1:3000:3000" and
# "127.0.0.1:8080:8080"), so they can only be reached through this proxy.
# Docker opens published ports past firewalls like ufw.
#
# The API answers CORS requests itself and the web app sets its own caching
# and security headers, so do not add any of these here.
#
# Behind Cloudflare Tunnel, Cloudflare handles HTTPS: drop the port 80 block,
# listen on a local port without ssl (listen 127.0.0.1:8000;), remove the
# ssl_certificate lines and add to both server blocks:
#   set_real_ip_from 127.0.0.1;
#   real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name yourspotify.example.com api.yourspotify.example.com;

    return 301 https://$host$request_uri;
}

# Web app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yourspotify.example.com;

    ssl_certificate /etc/letsencrypt/live/yourspotify.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourspotify.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.yourspotify.example.com;

    ssl_certificate /etc/letsencrypt/live/api.yourspotify.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourspotify.example.com/privkey.pem;

    # History imports upload up to 50 files of 20 MB in one request,
    # Nginx only allows 1 MB by default
    client_max_body_size 1000m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
